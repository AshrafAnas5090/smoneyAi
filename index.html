<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Money Analyzer Pro - Independent Custom Intervals</title>
<style>
:root{
--bg:#070b10;--panel:#0e141c;--panel2:#0a1017;--border:#1d2936;
--text:#eef3f8;--muted:#8b9bb0;--blue:#2f7df4;--green:#20c77a;
--red:#ef5350;--yellow:#f2bd4e;--purple:#8b5cf6;
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 10% 0%,rgba(47,125,244,.08),transparent 30%),#070b10;color:var(--text);font-family:Inter,system-ui,Arial,sans-serif;direction:ltr}
.app{width:min(98%,1700px);margin:auto;padding:20px 0 60px}
.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,#2f7df4,#20c77a);font-weight:900;font-size:18px;color:#fff}
h1{margin:0;font-size:22px;letter-spacing:-0.3px}.sub{margin:4px 0 0;color:var(--muted);font-size:13px}
.range{padding:8px 16px;border:1px solid var(--border);border-radius:999px;color:#cbd5e1;font-size:12px;font-weight:800;background:rgba(255,255,255,0.03)}
.search{display:flex;gap:10px;padding:12px;background:rgba(14,20,28,.88);border:1px solid var(--border);border-radius:15px;margin-bottom:12px}
input{flex:1;height:50px;padding:0 18px;background:var(--panel2);border:1px solid var(--border);border-radius:10px;color:#fff;outline:0;font-size:15px;font-weight:700}
input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(47,125,244,.15)}
button{cursor:pointer;font:inherit;font-weight:800;border-radius:9px}
.search-btn{min-width:140px;border:0;background:linear-gradient(135deg,#2f7df4,#1d62ca);color:#fff;font-size:14px;letter-spacing:0.5px}
.status{min-height:20px;margin:0 3px 12px;color:var(--muted);font-size:13px;font-weight:600}.status.ok{color:var(--green)}.status.err{color:var(--red)}

.records{display:grid;gap:20px}
.empty{padding:50px 20px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:14px;background:rgba(13,20,28,.6);font-size:15px}

.record-card{background:var(--panel);border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.record-header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:rgba(255,255,255,0.02);border-bottom:1px solid var(--border);flex-wrap:wrap;gap:10px}
.symbol-title{font-size:20px;font-weight:900;margin:0;letter-spacing:0.5px}
.header-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.small-btn{padding:6px 12px;font-size:11px;font-weight:800;border:1px solid var(--border);background:rgba(255,255,255,.04);color:#dce5ef;border-radius:6px}
.small-btn:disabled{opacity:0.4;cursor:not-allowed;border-color:var(--border)!important;background:rgba(255,255,255,0.01)!important;color:var(--muted)!important}
.small-btn.fetch{border-color:rgba(47,125,244,.4);background:rgba(47,125,244,.15);color:#9fc5ff}
.small-btn.del{border-color:rgba(239,83,80,.4);background:rgba(239,83,80,.15);color:#ffb8b5}
.small-btn.gemini{border-color:rgba(139,92,246,.4);background:rgba(139,92,246,.2);color:#d8b4fe}
.small-btn.gemini-compare{border-color:rgba(32,199,122,.4);background:rgba(32,199,122,.2);color:#72e6ac}

/* Timer & Dropdown Container */
.timer-control{display:inline-flex;align-items:center;gap:6px;padding:4px 8px;background:rgba(242,189,78,0.1);border:1px solid rgba(242,189,78,0.3);border-radius:6px}
.timer-badge{color:var(--yellow);font-size:11px;font-weight:900;font-family:Consolas,monospace;min-width:48px;text-align:center}
.timer-badge.finished{color:var(--purple)}
.interval-select{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:4px;font-size:11px;font-weight:700;padding:2px 4px;outline:0;cursor:pointer}

/* Table Style with Full Horizontal Scroll */
.table-container{overflow-x:auto;width:100%}
table.logs-table{width:100%;border-collapse:collapse;min-width:1700px;text-align:left;font-family:Consolas,monospace;font-size:12px}
th{background:#090f17;color:var(--muted);padding:10px 12px;font-size:10px;text-transform:uppercase;border-bottom:1px solid var(--border);letter-spacing:.5px;white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid #16212c;color:#e1e9f0;white-space:nowrap}
tr:last-child td{border-bottom:0}
tr:hover td{background:rgba(255,255,255,0.01)}

.up{color:var(--green)!important;font-weight:700}
.down{color:var(--red)!important;font-weight:700}
.buy{color:#72e6ac!important;font-weight:700}
.sell{color:#ff8582!important;font-weight:700}
.pos{color:#72e6ac!important}
.actions-cell{display:flex;gap:4px}
.row-btn{padding:3px 8px;font-size:10px;border-radius:4px;border:1px solid var(--border);background:rgba(255,255,255,0.03);color:#cbd5e1}
</style>
</head>
<body>
<div class="app">
<header class="top">
<div class="brand">
  <div class="logo">SM</div>
  <div><h1>Smart Money Analyzer Pro</h1><p class="sub">Binance Futures • Independent Custom Intervals</p></div>
</div>
<div class="range">CUSTOM TIMERS ACTIVE</div>
</header>

<section class="search">
<input id="coin" placeholder="Enter coin symbol e.g. BTC or ETH..." autocomplete="off">
<button id="search" class="search-btn">SEARCH & LOG</button>
</section>
<div id="status" class="status">Ready</div>

<main id="records" class="records"></main>
</div>

<script>
"use strict";
const KEY="smart_money_custom_timers_v12";
const SM="https://www.binance.com/bapi/futures/v1/public";
const FUT="https://fapi.binance.com";
let records=load();
const DEFAULT_INTERVAL = 30 * 60; // 30 دقيقة افتراضياً بالثواني
const coin=document.getElementById("coin"), search=document.getElementById("search"), status=document.getElementById("status"), recordsEl=document.getElementById("records");

function load(){
  try{
    const x=JSON.parse(localStorage.getItem(KEY)||"[]");
    const now = Math.floor(Date.now() / 1000);
    return Array.isArray(x)?x.map(r=>({
      ...r,
      intervalSec: r.intervalSec || DEFAULT_INTERVAL,
      nextFetchTime: r.nextFetchTime || (now + (r.intervalSec || DEFAULT_INTERVAL)),
      fetchedDone: r.fetchedDone || false
    })):[];
  }catch{return[]}
}
function save(){localStorage.setItem(KEY,JSON.stringify(records))}
function setStatus(t,c=""){status.textContent=t;status.className="status"+(c?" "+c:"")}
function sym(v){v=String(v||"").trim().toUpperCase();if(!v)return"";return v.endsWith("USDT")?v:v+"USDT"}
function n(v){v=Number(v);return Number.isFinite(v)?v:0}
function compact(v){v=n(v);const a=Math.abs(v);if(a>=1e9)return(v/1e9).toFixed(2)+"B";if(a>=1e6)return(v/1e6).toFixed(2)+"M";if(a>=1e3)return(v/1e3).toFixed(2)+"K";return v.toFixed(2)}
function price(v){v=n(v);if(v>=100)return v.toFixed(2);if(v>=1)return v.toFixed(4);if(v>=.01)return v.toFixed(6);return v.toFixed(8)}
function pct(v){return n(v).toFixed(2)+"%"}
function prof(p,t){return t?(p/t)*100:0}

async function req(url){const r=await fetch(url);if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}

async function fetchData(symbol){
const urls=[
SM+"/future/smart-money/signal/overview?symbol="+encodeURIComponent(symbol),
SM+"/future/smart-money/signal/details/stats?symbol="+encodeURIComponent(symbol)+"&timeRange=30m",
FUT+"/fapi/v1/ticker/price?symbol="+encodeURIComponent(symbol),
FUT+"/fapi/v1/ticker/24hr?symbol="+encodeURIComponent(symbol),
FUT+"/fapi/v1/openInterest?symbol="+encodeURIComponent(symbol),
FUT+"/fapi/v1/premiumIndex?symbol="+encodeURIComponent(symbol)
];
const [overview,stats30,priceData,volume,oi,funding]=await Promise.all(urls.map(req));
return{symbol,overview,stats30,price:priceData,volume,openInterest:oi,funding,fetchedAt:Date.now()}
}

function model(d){
const o=d.overview?.data||{}, s=d.stats30?.data||{};
const current=n(d.price?.price), volume=n(d.volume?.quoteVolume);
const priceChangePct=n(d.volume?.priceChangePercent);
const oiQty=n(d.openInterest?.openInterest), oiUSDT=oiQty*current;
const funding=n(d.funding?.lastFundingRate)*100;

const totalPositions=n(o.totalPositions);
const ratio=n(o.longShortRatio);
const longPosition = ratio>0 ? totalPositions*(ratio/(100+ratio)) : null;
const shortPosition = ratio>0 ? totalPositions/(1+(ratio/100)) : null;

const whaleTotalPositions=n(o.totalWhalePositions);
const whaleRatio = o.whaleLongShortRatio !== null ? n(o.whaleLongShortRatio) : null;
const whaleLongPosition = whaleRatio>0 ? whaleTotalPositions*(whaleRatio/(100+whaleRatio)) : null;
const whaleShortPosition = whaleRatio>0 ? whaleTotalPositions/(1+(whaleRatio/100)) : null;

return{
 current, volume, priceChangePct, oiUSDT, funding,
 longTraders:o.longTraders??"-", shortTraders:o.shortTraders??"-",
 longQty:compact(o.longTradersQty), shortQty:compact(o.shortTradersQty),
 longPosition:compact(longPosition), shortPosition:compact(shortPosition),
 longEntry:price(o.longTradersAvgEntryPrice), shortEntry:price(o.shortTradersAvgEntryPrice),
 longProfitTraders:o.longProfitTraders??"-", shortProfitTraders:o.shortProfitTraders??"-",
 longProfitPct:pct(prof(n(o.longProfitTraders),n(o.longTraders))),
 shortProfitPct:pct(prof(n(o.shortProfitTraders),n(o.shortTraders))),

 longWhales:o.longWhales??"-", shortWhales:o.shortWhales??"-",
 longWhaleQty:compact(o.longWhalesQty), shortWhaleQty:compact(o.shortWhalesQty),
 longWhalePosition:compact(whaleLongPosition), shortWhalePosition:compact(whaleShortPosition),
 longWhaleEntry:price(o.longWhalesAvgEntryPrice), shortWhaleEntry:price(o.shortWhalesAvgEntryPrice),
 longProfitWhales:o.longProfitWhales??"-", shortProfitWhales:o.shortProfitWhales??"-",
 longWhaleProfitPct:pct(prof(n(o.longProfitWhales),n(o.longWhales))),
 shortWhaleProfitPct:pct(prof(n(o.shortProfitWhales),n(o.shortWhales))),

 l30Traders:`LONG ${s.longTraders??"-"} | SHORT ${s.shortTraders??"-"}`,
 l30Whales:`LONG ${s.longWhales??"-"} | SHORT ${s.shortWhales??"-"}`,
 l30Pos:`LONG ${compact(s.longPositions)} | SHORT ${compact(s.shortPositions)}`,
 l30Qty:`LONG ${compact(s.longQty)} | SHORT ${compact(s.shortQty)}`
};
}

function render(){
if(!records.length){recordsEl.innerHTML='<div class="empty">No records found. Search for a coin symbol to build your logs.</div>';return}
const now = Math.floor(Date.now() / 1000);

recordsEl.innerHTML=records.map(r=>{
const intervalSec = r.intervalSec || DEFAULT_INTERVAL;
const timeLeft = Math.max(0, (r.nextFetchTime || (now + intervalSec)) - now);
const mins = String(Math.floor(timeLeft / 60)).padStart(2, '0');
const secs = String(timeLeft % 60).padStart(2, '0');
const isFinished = timeLeft === 0 || r.fetchedDone;
const hasMultipleLogs = r.logs && r.logs.length >= 2;
const currentMinutesMin = intervalSec / 60;

const rowsHtml = r.logs.map((log, idx)=>{
const vm=log.viewModel;
const isUp = vm.priceChangePct >= 0;
return `<tr>
  <td>#${r.logs.length - idx} <span style="color:var(--muted);font-size:10px">${new Date(log.fetchedAt).toLocaleTimeString()}</span></td>
  <td class="${isUp?'up':'down'}">$${price(vm.current)} (${isUp?'+':''}${vm.priceChangePct.toFixed(2)}%)</td>
  <td>${compact(vm.volume)}</td>
  <td>${compact(vm.oiUSDT)}</td>
  <td>${vm.funding.toFixed(4)}%</td>
  <td class="buy">${vm.longTraders}</td><td class="sell">${vm.shortTraders}</td>
  <td class="buy">${vm.longQty}</td><td class="sell">${vm.shortQty}</td>
  <td class="buy">${vm.longPosition}</td><td class="sell">${vm.shortPosition}</td>
  <td>${vm.longEntry}</td><td>${vm.shortEntry}</td>
  <td class="pos">${vm.longProfitTraders} (${vm.longProfitPct})</td><td class="pos">${vm.shortProfitTraders} (${vm.shortProfitPct})</td>
  <td class="buy">${vm.longWhales}</td><td class="sell">${vm.shortWhales}</td>
  <td class="buy">${vm.longWhaleQty}</td><td class="sell">${vm.shortWhaleQty}</td>
  <td class="buy">${vm.longWhalePosition}</td><td class="sell">${vm.shortWhalePosition}</td>
  <td>${vm.longWhaleEntry}</td><td>${vm.shortWhaleEntry}</td>
  <td class="pos">${vm.longProfitWhales} (${vm.longWhaleProfitPct})</td><td class="pos">${vm.shortProfitWhales} (${vm.shortWhaleProfitPct})</td>
  <td>${vm.l30Traders}</td><td>${vm.l30Whales}</td><td>${vm.l30Pos}</td><td>${vm.l30Qty}</td>
  <td>
    <div class="actions-cell">
      <button class="row-btn" style="color:var(--red)" onclick="deleteLog('${r.symbol}', ${idx})">DEL</button>
    </div>
  </td>
</tr>`;
}).join("");

return `<article class="record-card" data-symbol="${r.symbol}">
  <div class="record-header">
    <h3 class="symbol-title">${r.symbol} <span style="font-size:12px;color:var(--muted);font-weight:normal">(${r.logs.length} Logs Saved)</span></h3>
    <div class="header-actions">
      <div class="timer-control">
        <span class="timer-badge ${isFinished?'finished':''}" id="timer-${r.symbol}">${isFinished ? '✨ READY' : `⏱ ${mins}:${secs}`}</span>
        <select class="interval-select" onchange="changeInterval('${r.symbol}', this.value)">
          <option value="5" ${currentMinutesMin===5?'selected':''}>5m</option>
          <option value="10" ${currentMinutesMin===10?'selected':''}>10m</option>
          <option value="20" ${currentMinutesMin===20?'selected':''}>20m</option>
          <option value="30" ${currentMinutesMin===30?'selected':''}>30m</option>
        </select>
      </div>
      <button class="small-btn gemini" onclick="copyToGemini('${r.symbol}')">✨ COPY TO GEMINI</button>
      <button class="small-btn gemini-compare" ${hasMultipleLogs?'':'disabled'} onclick="copyToGeminiCompare('${r.symbol}')">📊 COPY (COMPARE 2 LOGS)</button>
      <button class="small-btn fetch" onclick="resetAndFetch('${r.symbol}')">+ FETCH NOW</button>
      <button class="small-btn del" onclick="delCoin('${r.symbol}')">DELETE ALL</button>
    </div>
  </div>
  <div class="table-container">
    <table class="logs-table">
      <thead>
        <tr>
          <th>Time / Log #</th>
          <th>Price & 24h%</th>
          <th>Volume</th>
          <th>Open Interest</th>
          <th>Funding</th>
          <th style="color:#72e6ac">Traders (L)</th><th style="color:#ff8582">Traders (S)</th>
          <th style="color:#72e6ac">Traders Qty (L)</th><th style="color:#ff8582">Traders Qty (S)</th>
          <th style="color:#72e6ac">Traders Value (L)</th><th style="color:#ff8582">Traders Value (S)</th>
          <th>Traders Entry (L)</th><th>Traders Entry (S)</th>
          <th>Traders Profitable (L)</th><th>Traders Profitable (S)</th>
          <th style="color:#72e6ac">Whales (L)</th><th style="color:#ff8582">Whales (S)</th>
          <th style="color:#72e6ac">Whales Qty (L)</th><th style="color:#ff8582">Whales Qty (S)</th>
          <th style="color:#72e6ac">Whales Value (L)</th><th style="color:#ff8582">Whales Value (S)</th>
          <th>Whales Entry (L)</th><th>Whales Entry (S)</th>
          <th>Whales Profitable (L)</th><th>Whales Profitable (S)</th>
          <th>30m Traders Flow</th>
          <th>30m Whales Flow</th>
          <th>30m Pos Flow</th>
          <th>30m Qty Flow</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>${rowsHtml}</tbody>
    </table>
  </div>
</article>`;
}).join("");
}

function changeInterval(symbol, minsVal){
const r=records.find(x=>x.symbol===symbol);
if(r){
  const newSec = parseInt(minsVal) * 60;
  r.intervalSec = newSec;
  const now = Math.floor(Date.now() / 1000);
  r.nextFetchTime = now + newSec;
  r.fetchedDone = false;
  save();render();
  setStatus(`Timer interval for ${symbol} updated to ${minsVal} minutes.`,"ok");
}
}

async function searchCoin(){
const symbol=sym(coin.value);if(!symbol){setStatus("Please enter a valid coin symbol.","err");return}
search.disabled=true;setStatus(`Fetching full data for ${symbol}...`);
try{
const data=await fetchData(symbol);
const vm=model(data);
const logEntry={viewModel:vm, fetchedAt:Date.now()};
let existing=records.find(x=>x.symbol===symbol);
const now = Math.floor(Date.now() / 1000);
if(existing){
  existing.logs.unshift(logEntry);
  const interval = existing.intervalSec || DEFAULT_INTERVAL;
  existing.nextFetchTime = now + interval;
  existing.fetchedDone = false;
}else{
  records.unshift({symbol, logs:[logEntry], intervalSec: DEFAULT_INTERVAL, nextFetchTime: now + DEFAULT_INTERVAL, fetchedDone: false});
}
save();render();coin.value="";setStatus(`${symbol} full row log added successfully.`,"ok");
}catch(e){console.error(e);setStatus(`Failed to load ${symbol}: ${e.message}`,"err")}finally{search.disabled=false}
}

async function resetAndFetch(symbol){
setStatus(`Adding new row log for ${symbol}...`);
try{
const data=await fetchData(symbol);
const vm=model(data);
const logEntry={viewModel:vm, fetchedAt:Date.now()};
const existing=records.find(x=>x.symbol===symbol);
const now = Math.floor(Date.now() / 1000);
if(existing){
  existing.logs.unshift(logEntry);
  const interval = existing.intervalSec || DEFAULT_INTERVAL;
  existing.nextFetchTime = now + interval;
  existing.fetchedDone = false;
  save();render();setStatus(`New log added for ${symbol}.`,"ok");
}
}catch(e){console.error(e);setStatus(`Failed: ${e.message}`,"err")}
}

function deleteLog(symbol, idx){
if(!confirm("Delete this log row?"))return;
const r=records.find(x=>x.symbol===symbol);
if(r){r.logs.splice(idx,1);if(!r.logs.length)records=records.filter(x=>x.symbol!==symbol);save();render();setStatus("Log row deleted.","ok");}
}

function delCoin(symbol){
if(!confirm(`Delete all logs for ${symbol}?`))return;
records=records.filter(x=>x.symbol!==symbol);save();render();setStatus(`${symbol} deleted.`,"ok");
}

// الزر الأول: النسخ العادي (أحدث لوج فقط بكافة تفاصيله)
function copyToGemini(symbol){
const r=records.find(x=>x.symbol===symbol);
if(!r || !r.logs || !r.logs.length)return;
const vm = r.logs[0].viewModel;

const expertPrompt = `You are an expert crypto market analyst, quantitative developer, and Smart Money / Scalping specialist on Binance Futures.

ANALYSIS GUIDELINES:
- Focus on short-term SCALPING strategy.
- Analyze LONG and SHORT positions independently, then compare them.
- Focus on real-time Smart Money flow, Whales, and the last 30 minutes momentum.
- Do NOT force a trade setup. Use NO_TRADE if signals conflict or data is insufficient.
- Ensure LONG + SHORT + NEUTRAL probabilities equal exactly 100%.
- Respond ONLY in English.

MARKET DATA:
Current Price: ${vm.current}
24h Volume (USDT): ${vm.volume}
Open Interest (USDT): ${vm.oiUSDT}
Funding Rate: ${vm.funding}%
Timeframe: 30m

SMART TRADERS - BUY / LONG:
Traders Count: ${vm.longTraders}
Position Quantity: ${vm.longQty}
Total Value (USDT): ${vm.longPosition}
Average Entry Price: ${vm.longEntry}
Profitable Traders: ${vm.longProfitTraders} (${vm.longProfitPct})

SMART TRADERS - SELL / SHORT:
Traders Count: ${vm.shortTraders}
Position Quantity: ${vm.shortQty}
Total Value (USDT): ${vm.shortPosition}
Average Entry Price: ${vm.shortEntry}
Profitable Traders: ${vm.shortProfitTraders} (${vm.shortProfitPct})

WHALES - BUY / LONG:
Whales Count: ${vm.longWhales}
Position Quantity: ${vm.longWhaleQty}
Total Value (USDT): ${vm.longWhalePosition}
Average Entry Price: ${vm.longWhaleEntry}
Profitable Whales: ${vm.longProfitWhales} (${vm.longWhaleProfitPct})

WHALES - SELL / SHORT:
Whales Count: ${vm.shortWhales}
Position Quantity: ${vm.shortWhaleQty}
Total Value (USDT): ${vm.shortWhalePosition}
Average Entry Price: ${vm.shortWhaleEntry}
Profitable Whales: ${vm.shortProfitWhales} (${vm.shortWhaleProfitPct})

LAST 30 MINUTES SMART MONEY FLOW:
Traders Delta: ${vm.l30Traders}
Whales Delta: ${vm.l30Whales}
Positions Delta: ${vm.l30Pos}
Whale Quantity Delta: ${vm.l30Qty}

MANDATORY OUTPUT FORMAT (STRICTLY NO JSON BRACKETS \`{\` \`}\` OR \`[\` \`]\`):
Respond strictly in English using the following clean, professional text dashboard structure:

=== 🎯 FINAL VERDICT & DECISION ===
Decision: [TRADE or NO_TRADE]
Preferred Setup: [LONG or SHORT or NONE]
Confidence Score: [0-100]%
Signal Strength: [STRONG / MEDIUM / WEAK]

=== 📊 DIRECTIONAL PROBABILITIES ===
LONG Probability: [Number]%
SHORT Probability: [Number]%
NEUTRAL Probability: [Number]%
(Note: LONG + SHORT + NEUTRAL must sum to exactly 100%)

=== 🚀 SCALPING TRADE PLAN ===
Setup: [LONG / SHORT]
Status: [AVAILABLE / NOT_AVAILABLE]
Entry Zone: [Min Price - Max Price]
Fast Entry: [Price]
Confirmation Entry: [Price]
Take Profit Targets:
- TP1: [Price]
- TP2: [Price]
- TP3: [Price]
Stop Loss: [Price]
Risk/Reward Ratio: [Ratio, e.g., 1:2.5]

=== 🔍 LIQUIDITY & DATA ANALYSIS ===
Smart Money Bias: [Brief description]
Whale Bias: [Brief description]
Buy vs Sell Pressure: [Brief description]
Accumulation or Distribution: [ACCUMULATION / DISTRIBUTION / NEUTRAL]
Signal Conflicts: [Explanation if any]

=== ⚠️ REASONS & RISKS ===
Key Supporting Reasons:
• [Reason 1]
• [Reason 2]
Key Risk Factors:
• [Risk 1]
• [Risk 2]`;

navigator.clipboard.writeText(expertPrompt).then(() => {
  setStatus(`Expert Gemini prompt copied successfully for ${symbol} (Latest Log).`,"ok");
});
}

// الزر الثاني: النسخ مع المقارنة الكاملة والشاملة لكافة بيانات اللوج الأول واللوج الثاني
function copyToGeminiCompare(symbol){
const r=records.find(x=>x.symbol===symbol);
if(!r || !r.logs || r.logs.length < 2)return;
const vmNew = r.logs[0].viewModel; // اللوج الحالي (الأحدث)
const vmOld = r.logs[1].viewModel; // اللوج السابق
const timeNew = new Date(r.logs[0].fetchedAt).toLocaleTimeString("en-US");
const timeOld = new Date(r.logs[1].fetchedAt).toLocaleTimeString("en-US");

const comparePrompt = `You are an expert crypto market analyst, quantitative developer, and Smart Money / Scalping specialist on Binance Futures.

ANALYSIS GUIDELINES:
- Focus on short-term SCALPING strategy.
- Compare PREVIOUS log data (${timeOld}) and CURRENT log data after interval update (${timeNew}) comprehensively across ALL recorded data points.
- Analyze how Smart Money, Whales, Open Interest, Funding Rates, and Positions have shifted between the two timeframes.
- Do NOT force a trade setup. Use NO_TRADE if signals conflict or data is insufficient.
- Ensure LONG + SHORT + NEUTRAL probabilities equal exactly 100%.
- Respond ONLY in English.

==================================================
📊 1. PREVIOUS MARKET DATA (${timeOld})
==================================================
Current Price: ${vmOld.current}
24h Volume (USDT): ${vmOld.volume}
Open Interest (USDT): ${vmOld.oiUSDT}
Funding Rate: ${vmOld.funding}%

SMART TRADERS - BUY / LONG:
- Traders Count: ${vmOld.longTraders}
- Position Quantity: ${vmOld.longQty}
- Total Value (USDT): ${vmOld.longPosition}
- Average Entry Price: ${vmOld.longEntry}
- Profitable Traders: ${vmOld.longProfitTraders} (${vmOld.longProfitPct})

SMART TRADERS - SELL / SHORT:
- Traders Count: ${vmOld.shortTraders}
- Position Quantity: ${vmOld.shortQty}
- Total Value (USDT): ${vmOld.shortPosition}
- Average Entry Price: ${vmOld.shortEntry}
- Profitable Traders: ${vmOld.shortProfitTraders} (${vmOld.shortProfitPct})

WHALES - BUY / LONG:
- Whales Count: ${vmOld.longWhales}
- Position Quantity: ${vmOld.longWhaleQty}
- Total Value (USDT): ${vmOld.longWhalePosition}
- Average Entry Price: ${vmOld.longWhaleEntry}
- Profitable Whales: ${vmOld.longProfitWhales} (${vmOld.longWhaleProfitPct})

WHALES - SELL / SHORT:
- Whales Count: ${vmOld.shortWhales}
- Position Quantity: ${vmOld.shortWhaleQty}
- Total Value (USDT): ${vmOld.shortWhalePosition}
- Average Entry Price: ${vmOld.shortWhaleEntry}
- Profitable Whales: ${vmOld.shortProfitWhales} (${vmOld.shortWhaleProfitPct})

LAST INTERVAL FLOW (At that time):
- Traders Delta: ${vmOld.l30Traders}
- Whales Delta: ${vmOld.l30Whales}
- Positions Delta: ${vmOld.l30Pos}
- Whale Quantity Delta: ${vmOld.l30Qty}


==================================================
🚀 2. CURRENT MARKET DATA (${timeNew}) - AFTER INTERVAL UPDATE
==================================================
Current Price: ${vmNew.current}
24h Volume (USDT): ${vmNew.volume}
Open Interest (USDT): ${vmNew.oiUSDT}
Funding Rate: ${vmNew.funding}%

SMART TRADERS - BUY / LONG:
- Traders Count: ${vmNew.longTraders}
- Position Quantity: ${vmNew.longQty}
- Total Value (USDT): ${vmNew.longPosition}
- Average Entry Price: ${vmNew.longEntry}
- Profitable Traders: ${vmNew.longProfitTraders} (${vmNew.longProfitPct})

SMART TRADERS - SELL / SHORT:
- Traders Count: ${vmNew.shortTraders}
- Position Quantity: ${vmNew.shortQty}
- Total Value (USDT): ${vmNew.shortPosition}
- Average Entry Price: ${vmNew.shortEntry}
- Profitable Traders: ${vmNew.shortProfitTraders} (${vmNew.shortProfitPct})

WHALES - BUY / LONG:
- Whales Count: ${vmNew.longWhales}
- Position Quantity: ${vmNew.longWhaleQty}
- Total Value (USDT): ${vmNew.longWhalePosition}
- Average Entry Price: ${vmNew.longWhaleEntry}
- Profitable Whales: ${vmNew.longProfitWhales} (${vmNew.longWhaleProfitPct})

WHALES - SELL / SHORT:
- Whales Count: ${vmNew.shortWhales}
- Position Quantity: ${vmNew.shortWhaleQty}
- Total Value (USDT): ${vmNew.shortWhalePosition}
- Average Entry Price: ${vmNew.shortWhaleEntry}
- Profitable Whales: ${vmNew.shortProfitWhales} (${vmNew.shortWhaleProfitPct})

LAST INTERVAL FLOW (Current update):
- Traders Delta: ${vmNew.l30Traders}
- Whales Delta: ${vmNew.l30Whales}
- Positions Delta: ${vmNew.l30Pos}
- Whale Quantity Delta: ${vmNew.l30Qty}


MANDATORY OUTPUT FORMAT (STRICTLY NO JSON BRACKETS \`{\` \`}\` OR \`[\` \`]\`):
Respond strictly in English using the following clean, professional text dashboard structure:

=== 🎯 FINAL VERDICT & DECISION ===
Decision: [TRADE or NO_TRADE]
Preferred Setup: [LONG or SHORT or NONE]
Confidence Score: [0-100]%
Signal Strength: [STRONG / MEDIUM / WEAK]

=== 📊 DIRECTIONAL PROBABILITIES ===
LONG Probability: [Number]%
SHORT Probability: [Number]%
NEUTRAL Probability: [Number]%
(Note: LONG + SHORT + NEUTRAL must sum to exactly 100%)

=== 🚀 SCALPING TRADE PLAN ===
Setup: [LONG / SHORT]
Status: [AVAILABLE / NOT_AVAILABLE]
Entry Zone: [Min Price - Max Price]
Fast Entry: [Price]
Confirmation Entry: [Price]
Take Profit Targets:
- TP1: [Price]
- TP2: [Price]
- TP3: [Price]
Stop Loss: [Price]
Risk/Reward Ratio: [Ratio, e.g., 1:2.5]

=== 🔍 LIQUIDITY & DATA ANALYSIS ===
Smart Money Bias: [Detailed analysis of shift between logs]
Whale Bias: [Detailed analysis of whale behavior change]
Buy vs Sell Pressure: [Brief description]
Accumulation or Distribution: [ACCUMULATION / DISTRIBUTION / NEUTRAL]
Signal Conflicts: [Explanation if any]

=== ⚠️ REASONS & RISKS ===
Key Supporting Reasons:
• [Reason 1 based on data comparison]
• [Reason 2]
Key Risk Factors:
• [Risk 1]
• [Risk 2]`;

navigator.clipboard.writeText(comparePrompt).then(() => {
  setStatus(`Full comparison prompt (Log 1 vs Log 2) copied successfully for ${symbol}.`,"ok");
});
}

// Global Timer Loop (Independent for each coin)
setInterval(() => {
  const now = Math.floor(Date.now() / 1000);
  records.forEach(r => {
    const interval = r.intervalSec || DEFAULT_INTERVAL;
    if (!r.nextFetchTime) r.nextFetchTime = now + interval;

    if (!r.fetchedDone && now >= r.nextFetchTime) {
      r.fetchedDone = true;
      fetchData(r.symbol).then(data => {
        const vm = model(data);
        r.logs.unshift({viewModel: vm, fetchedAt: Date.now()});
        r.nextFetchTime = Math.floor(Date.now() / 1000) + (r.intervalSec || DEFAULT_INTERVAL);
        r.fetchedDone = false;
        save();
        render();
      }).catch(err => {
        console.error("Auto fetch error for", r.symbol, err);
        r.fetchedDone = false;
        r.nextFetchTime = Math.floor(Date.now() / 1000) + 15; // إعادة المحاولة بعد 15 ثانية في حال الفشل
      });
    } else if (!r.fetchedDone) {
      const badge = document.getElementById(`timer-${r.symbol}`);
      if (badge) {
        const timeLeft = Math.max(0, r.nextFetchTime - now);
        const mins = String(Math.floor(timeLeft / 60)).padStart(2, '0');
        const secs = String(timeLeft % 60).padStart(2, '0');
        badge.textContent = `⏱ ${mins}:${secs}`;
      }
    }
  });
}, 1000);

search.addEventListener("click",searchCoin);
coin.addEventListener("keydown",e=>{if(e.key==="Enter")searchCoin()});
render();
</script>
</body>
</html>
